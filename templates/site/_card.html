{% macro card(art) %}
<a class="card" href="{{ art.href }}">
{% if art.image %}<img src="{{ art.image.url }}" alt="{{ art.image.alt }}" loading="lazy">
{% endif %}
<h3>{% if art.role == 'hero' %}<span class="badge">★</span>{% endif %}{{ art.title }}</h3>
<p>{{ art.meta_description }}</p>
</a>
{% endmacro %}
