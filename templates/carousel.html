<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: {{bg_color}};
    --fg: {{fg_color}};
    --accent: {{accent_color}};
    --muted: {{muted_color}};
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px;
    height: 1350px;
    background: var(--bg);
    font-family: "DejaVu Sans", Arial, sans-serif;
    overflow: hidden;
  }
  .slide {
    width: 1080px;
    height: 1350px;
    position: relative;
    background: radial-gradient(circle at 15% -10%, color-mix(in srgb, var(--accent) 22%, var(--bg)) 0%, var(--bg) 55%);
    display: flex;
    flex-direction: column;
    padding: 64px 72px;
  }
  .brand {
    position: absolute;
    top: 48px;
    left: 72px;
    font-size: 30px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.5px;
  }
  .counter {
    position: absolute;
    top: 52px;
    right: 72px;
    font-size: 26px;
    font-weight: 600;
    color: var(--muted);
  }
  .content {
    margin-top: 220px;
    display: flex;
    flex-direction: column;
    gap: 36px;
  }
  .title {
    font-size: 64px;
    font-weight: 800;
    line-height: 1.15;
    color: var(--fg);
  }
  .body {
    font-size: 38px;
    line-height: 1.45;
    color: var(--fg);
    opacity: 0.92;
  }
  .source {
    position: absolute;
    left: 72px;
    bottom: 64px;
    font-size: 24px;
    font-style: italic;
    color: var(--muted);
  }
  .disclosure {
    position: absolute;
    left: 72px;
    right: 72px;
    bottom: 24px;
    font-size: 20px;
    text-align: center;
    color: var(--muted);
    border-top: 1px solid color-mix(in srgb, var(--muted) 35%, transparent);
    padding-top: 16px;
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="brand">{{brand}}</div>
    <div class="counter">{{slide_num}}/{{slide_total}}</div>
    <div class="content">
      <div class="title">{{title}}</div>
      <div class="body">{{body}}</div>
    </div>
    <div class="source">{{source}}</div>
    {{disclosure_block}}
  </div>
</body>
</html>
