name: daily
on:
  schedule:
    - cron: "15 9 * * *"            # 06:15 America/Buenos_Aires; publica antes de las 07:00
    - cron: "0 10 * * *"            # reintento 07:00 ART por si GitHub saltea el primero (todas las etapas son idempotentes)
  workflow_dispatch:
    inputs:
      vertical: {description: "vertical", default: "tech"}
      date:     {description: "YYYY-MM-DD (vacío = hoy)", default: ""}
      from:     {description: "etapa inicial", default: "ingest"}
      to:       {description: "etapa final", default: "site"}
      dry_run:  {description: "no publicar (todo va al pack)", type: boolean, default: false}
      force:    {description: "rehacer etapas aunque ya tengan resultado", type: boolean, default: false}
concurrency: {group: state, cancel-in-progress: false}
permissions: {contents: write, pages: write, id-token: write}
jobs:
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy: {matrix: {vertical: [tech]}, max-parallel: 1}
    env:
      # secrets explícitos (nunca toJSON(secrets): GitHub lo marca como exfiltración)
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_OPERATOR_CHAT_ID: ${{ secrets.TELEGRAM_OPERATOR_CHAT_ID }}
      NM_TECH_ES_BSKY_HANDLE: ${{ secrets.NM_TECH_ES_BSKY_HANDLE }}
      NM_TECH_ES_BSKY_APP_PASSWORD: ${{ secrets.NM_TECH_ES_BSKY_APP_PASSWORD }}
      NM_TECH_ES_MASTO_TOKEN: ${{ secrets.NM_TECH_ES_MASTO_TOKEN }}
      NM_TECH_ES_X_API_KEY: ${{ secrets.NM_TECH_ES_X_API_KEY }}
      NM_TECH_ES_X_API_SECRET: ${{ secrets.NM_TECH_ES_X_API_SECRET }}
      NM_TECH_ES_X_ACCESS_TOKEN: ${{ secrets.NM_TECH_ES_X_ACCESS_TOKEN }}
      NM_TECH_ES_X_ACCESS_SECRET: ${{ secrets.NM_TECH_ES_X_ACCESS_SECRET }}
      NM_TECH_ES_THREADS_USER_ID: ${{ secrets.NM_TECH_ES_THREADS_USER_ID }}
      NM_TECH_ES_THREADS_TOKEN: ${{ secrets.NM_TECH_ES_THREADS_TOKEN }}
      NM_TECH_ES_IG_USER_ID: ${{ secrets.NM_TECH_ES_IG_USER_ID }}
      NM_TECH_ES_IG_TOKEN: ${{ secrets.NM_TECH_ES_IG_TOKEN }}
      NM_TECH_ES_YT_CLIENT_ID: ${{ secrets.NM_TECH_ES_YT_CLIENT_ID }}
      NM_TECH_ES_YT_CLIENT_SECRET: ${{ secrets.NM_TECH_ES_YT_CLIENT_SECRET }}
      NM_TECH_ES_YT_REFRESH_TOKEN: ${{ secrets.NM_TECH_ES_YT_REFRESH_TOKEN }}
      NM_TECH_ES_TIKTOK_TOKEN: ${{ secrets.NM_TECH_ES_TIKTOK_TOKEN }}
      NM_TECH_EN_BSKY_HANDLE: ${{ secrets.NM_TECH_EN_BSKY_HANDLE }}
      NM_TECH_EN_BSKY_APP_PASSWORD: ${{ secrets.NM_TECH_EN_BSKY_APP_PASSWORD }}
      NM_TECH_EN_MASTO_TOKEN: ${{ secrets.NM_TECH_EN_MASTO_TOKEN }}
      NM_TECH_EN_X_API_KEY: ${{ secrets.NM_TECH_EN_X_API_KEY }}
      NM_TECH_EN_X_API_SECRET: ${{ secrets.NM_TECH_EN_X_API_SECRET }}
      NM_TECH_EN_X_ACCESS_TOKEN: ${{ secrets.NM_TECH_EN_X_ACCESS_TOKEN }}
      NM_TECH_EN_X_ACCESS_SECRET: ${{ secrets.NM_TECH_EN_X_ACCESS_SECRET }}
      NM_TECH_EN_THREADS_USER_ID: ${{ secrets.NM_TECH_EN_THREADS_USER_ID }}
      NM_TECH_EN_THREADS_TOKEN: ${{ secrets.NM_TECH_EN_THREADS_TOKEN }}
      NM_TECH_EN_IG_USER_ID: ${{ secrets.NM_TECH_EN_IG_USER_ID }}
      NM_TECH_EN_IG_TOKEN: ${{ secrets.NM_TECH_EN_IG_TOKEN }}
      NM_TECH_EN_YT_CLIENT_ID: ${{ secrets.NM_TECH_EN_YT_CLIENT_ID }}
      NM_TECH_EN_YT_CLIENT_SECRET: ${{ secrets.NM_TECH_EN_YT_CLIENT_SECRET }}
      NM_TECH_EN_YT_REFRESH_TOKEN: ${{ secrets.NM_TECH_EN_YT_REFRESH_TOKEN }}
      NM_TECH_EN_TIKTOK_TOKEN: ${{ secrets.NM_TECH_EN_TIKTOK_TOKEN }}
      NM_TECH_EN_LI_TOKEN: ${{ secrets.NM_TECH_EN_LI_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null && ffprobe -version | head -1   # ffmpeg completo: ffprobe + libass
      - name: pipeline
        run: >
          python -m newsmachine.run --vertical ${{ inputs.vertical || matrix.vertical }}
          --from ${{ inputs.from || 'ingest' }} --to ${{ inputs.to || 'site' }}
          ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
          ${{ inputs.dry_run && '--dry-run' || '' }}
          ${{ inputs.force && '--force' || '' }}
      - name: sitio (siempre, aunque el pipeline haya fallado antes)
        if: always()
        run: python -m newsmachine.site --vertical ${{ inputs.vertical || matrix.vertical }}
      - name: commit state
        if: always()
        run: |
          git config user.name sintia-bot && git config user.email sintia-bot@users.noreply.github.com
          git add state/ && (git commit -qm "state ${{ matrix.vertical }} $(date -u +%F)" || exit 0)
          git pull --rebase -q && git push -q
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "out-${{ matrix.vertical }}-${{ github.run_id }}", path: out/, retention-days: 7, if-no-files-found: ignore}
      - uses: actions/configure-pages@v5
        if: always()
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with: {path: site/}
  deploy:
    needs: edition
    if: always()
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.deployment.outputs.page_url }}"}
    permissions: {pages: write, id-token: write}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
