name: daily
on:
  schedule:
    - cron: "15 9 * * *"            # 06:15 America/Buenos_Aires; publica antes de las 07:00
  workflow_dispatch:
    inputs:
      vertical: {description: "vertical", default: "tech"}
      date:     {description: "YYYY-MM-DD (vacío = hoy)", default: ""}
      from:     {description: "etapa inicial", default: "ingest"}
      to:       {description: "etapa final", default: "site"}
      dry_run:  {description: "no publicar (todo va al pack)", type: boolean, default: false}
concurrency: {group: state, cancel-in-progress: false}
permissions: {contents: write, pages: write, id-token: write}
jobs:
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy: {matrix: {vertical: [tech]}, max-parallel: 1}
    env:
      SECRETS_JSON: ${{ toJSON(secrets) }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: ffmpeg -version | head -1
      - name: pipeline
        run: >
          python -m newsmachine.run --vertical ${{ inputs.vertical || matrix.vertical }}
          --from ${{ inputs.from || 'ingest' }} --to ${{ inputs.to || 'site' }}
          ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
          ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: sitio (siempre, aunque el pipeline haya fallado antes)
        if: always()
        run: python -m newsmachine.site --vertical ${{ inputs.vertical || matrix.vertical }}
      - name: commit state
        if: always()
        run: |
          git config user.name sintia-bot && git config user.email sintia-bot@users.noreply.github.com
          git add state/ && (git commit -qm "state ${{ matrix.vertical }} $(date -u +%F)" || exit 0)
          git pull --rebase -q && git push -q
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "out-${{ matrix.vertical }}-${{ github.run_id }}", path: out/, retention-days: 7, if-no-files-found: ignore}
      - uses: actions/configure-pages@v5
        if: always()
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with: {path: site/}
  deploy:
    needs: edition
    if: always()
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.deployment.outputs.page_url }}"}
    permissions: {pages: write, id-token: write}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
