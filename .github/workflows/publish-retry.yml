name: publish-retry
on:
  workflow_dispatch:
    inputs:
      vertical: {default: "tech"}
      date:     {description: "YYYY-MM-DD (vacío = hoy)", default: ""}
      from:     {description: "publish | media | qa", default: "publish"}
      network:  {description: "solo esta red (vacío = todas)", default: ""}
concurrency: {group: state, cancel-in-progress: false}
permissions: {contents: write}
jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SECRETS_JSON: ${{ toJSON(secrets) }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: >
          python -m newsmachine.run --vertical ${{ inputs.vertical }} --from ${{ inputs.from }} --to publish
          ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
          ${{ inputs.network && format('--network {0}', inputs.network) || '' }}
      - name: commit state
        if: always()
        run: |
          git config user.name sintia-bot && git config user.email sintia-bot@users.noreply.github.com
          git add state/ && (git commit -qm "retry ${{ inputs.vertical }} $(date -u +%F)" || exit 0)
          git pull --rebase -q && git push -q
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "retry-${{ inputs.vertical }}-${{ github.run_id }}", path: out/, retention-days: 7, if-no-files-found: ignore}
